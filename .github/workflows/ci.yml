# Integração contínua: sintaxe (PHP 8.2 e 8.5), scripts shell e instalação Docker completa com teste de saúde e do usuário de BI.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sintaxe:
    name: Sintaxe (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        php: ["8.2", "8.5"]
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, sodium, mbstring, fileinfo, ldap
          coverage: none
      - name: php -l em todos os arquivos
        run: find . -name '*.php' -not -path './storage/*' -print0 | xargs -0 -n1 -P4 php -l > /dev/null
      - name: Scripts shell
        run: for f in docker/*.sh; do bash -n "$f"; done

  docker:
    name: Instalação Docker + saúde
    runs-on: ubuntu-24.04
    needs: sintaxe
    steps:
      - uses: actions/checkout@v5
      - name: Instala com docker/instalar.sh (porta 8222)
        run: sudo SAG_PORTA=8222 SAG_ADMIN_EMAIL=ci@salinasgold.com.br SAG_ADMIN_NOME="CI" bash docker/instalar.sh "$PWD" < /dev/null
      - name: /saude responde ok
        run: curl -fsS http://127.0.0.1:8222/saude | grep '"status":"ok"'
      - name: Login abre e arquivos sensíveis ficam bloqueados
        run: |
          curl -fsS -o /dev/null http://127.0.0.1:8222/login
          for u in /.env /docker/app.env /bin/console.php /storage/logs/app.log; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8222$u")
            echo "$u -> $code"; [ "$code" != "200" ]
          done
      - name: Usuário de BI vê só as views bi_* (somente leitura)
        run: |
          cd /opt/salinas-access-gate
          bi() { printf '%s\n' "$1" | sudo bash -c 'set -a; . docker/bi.env; set +a; docker compose exec -T -e SAG_BI_SENHA db sh -c "exec mariadb -h127.0.0.1 -usag_bi -p\"\$SAG_BI_SENHA\" salinas_access_gate -N"'; }
          deve_negar() { if bi "$1" 2>/dev/null; then echo "FALHA: permitido -> $1"; exit 1; else echo "negado (ok): $1"; fi; }
          sudo docker compose exec -T app php bin/console.php bi-verificar
          [ "$(bi 'SELECT COUNT(*) FROM bi_dicionario')" -gt 0 ]
          bi 'SELECT COUNT(*) FROM bi_fato_movimentacao'
          bi 'SELECT COUNT(*) FROM bi_presenca_atual'
          deve_negar 'SELECT * FROM pessoas LIMIT 1'
          deve_negar 'SELECT senha_hash FROM usuarios LIMIT 1'
          deve_negar 'DELETE FROM bi_dicionario'
          deve_negar 'CREATE TABLE x (i INT)'
      - name: Logs (em caso de falha)
        if: failure()
        run: sudo docker compose -f /opt/salinas-access-gate/docker-compose.yml logs --tail=200
