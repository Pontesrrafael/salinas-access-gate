; Salinas Access Gate — ajustes de PHP (container)
date.timezone = America/Cuiaba
expose_php = Off
memory_limit = 256M
upload_max_filesize = 8M
post_max_size = 72M
max_file_uploads = 20
max_execution_time = 60
session.use_strict_mode = 1
opcache.enable = 1
opcache.memory_consumption = 128
opcache.validate_timestamps = 0
